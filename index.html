<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D233F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pitching Lab">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<script>if (!window.supabase) document.write('<script src="https://unpkg.com/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"><\/script>');</script>
<style>
input[type=email],input[type=password]{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.linkbtn{background:none;border:0;padding:0;font-weight:700;text-decoration:underline;cursor:pointer}
.rbadge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;margin-left:6px;border-radius:999px;background:var(--red);color:#fff;font:700 12px/1 Barlow,sans-serif;vertical-align:2px}
.rcard.done{opacity:.75}
.rcat{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--surface2);border:1px solid var(--line)}
.rmsg{margin:10px 0 0;white-space:pre-wrap;font-size:16px}
.rreply{margin-top:10px;background:var(--surface2);border-left:4px solid var(--navy);border-radius:8px;padding:8px 10px;white-space:pre-wrap}
.seg{display:inline-flex;flex-wrap:wrap}
</style>
<title>ICC Pitching Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8ECF2;--surface:#FFFFFF;--surface2:#F3F5F9;--ink:#0D1B2E;--muted:#56637A;--line:#D3DAE4;
  --navy:#0D233F;--navy-ink:#FFFFFF;--red:#D10A0A;--red-ink:#FFFFFF;--red-soft:#FBE6E6;
  --good:#1F8A4C;--gold:#C99A1E;--silver:#8E99A8;--bronze:#A8693A;--net:rgba(255,255,255,.07);
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#08121F;--surface:#112038;--surface2:#0C1A2E;--ink:#EEF2F8;--muted:#9FB0C8;--line:#24395A;
    --navy:#17375F;--red:#F2443A;--red-soft:#3A1620;--good:#3FBF74;--gold:#E2B640;--silver:#A9B4C2;--bronze:#D08A55;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#08121F;--surface:#112038;--surface2:#0C1A2E;--ink:#EEF2F8;--muted:#9FB0C8;--line:#24395A;
  --navy:#17375F;--red:#F2443A;--red-soft:#3A1620;--good:#3FBF74;--gold:#E2B640;--silver:#A9B4C2;--bronze:#D08A55;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,"Segoe UI",system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
h1,h2,h3,.cond{font-family:"Barlow Condensed","Arial Narrow",Barlow,sans-serif;letter-spacing:.01em;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.sub{color:var(--muted)}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--navy);color:var(--navy-ink)}
.bar{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px}
.bar img{width:34px;height:36px;object-fit:contain}
.bar .t{line-height:1.05}
.bar .t b{font-family:"Barlow Condensed",sans-serif;font-size:22px;font-weight:800;display:block}
.bar .t span{font-size:13px;opacity:.75}
.bar .sp{flex:1}
.role{font-size:12px;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.14)}
nav.tabs{max-width:1080px;margin:0 auto;display:flex;gap:4px;padding:0 10px;overflow-x:auto}
nav.tabs a{padding:9px 12px 11px;text-decoration:none;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:18px;opacity:.7;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs a[aria-current="page"]{opacity:1;border-color:var(--red)}
main{max-width:1080px;margin:0 auto;padding:18px 16px 60px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.stack>*+*{margin-top:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer;background:var(--red);color:var(--red-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.navy{background:var(--navy);color:var(--navy-ink)}
.btn.sm{padding:6px 10px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon{border:1px solid var(--line);background:transparent;border-radius:8px;width:34px;height:34px;cursor:pointer;line-height:1;font-size:16px}
input[type=text],input[type=number],input[type=date],input[type=url],select,textarea{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
textarea{resize:vertical;min-height:70px}
label.f{display:block;font-size:14px;font-weight:600;margin-bottom:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:640px){.grid2{grid-template-columns:1fr}}
.note{background:var(--red-soft);border-radius:10px;padding:10px 12px;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;z-index:50;font-size:15px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.empty{text-align:center;padding:28px 12px;color:var(--muted)}

/* roster */
.search{max-width:320px}
.plist{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.plist a{display:flex;gap:12px;align-items:center;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.plist a:hover{border-color:var(--navy)}
.jn{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:26px;width:46px;height:46px;border-radius:10px;display:grid;place-items:center;background:var(--navy);color:#fff;flex:none}
.plist b{display:block;line-height:1.2}
.flawtag{display:inline-block;font-size:13px;font-weight:600;color:var(--red);margin-top:2px}
.flawtag.none{color:var(--muted);font-weight:500}

/* player routine */
.phead{display:flex;gap:16px;align-items:center}
.phead .jn{width:64px;height:64px;font-size:36px;border-radius:14px}
.phead h1{font-size:34px;line-height:1}
.flawhero{border-left:6px solid var(--red)}
.flawhero h2{font-size:28px;line-height:1.1}
.cue{font-family:"Barlow Condensed",sans-serif;font-size:24px;font-weight:700;color:var(--red)}
.phase h3{font-size:20px;display:flex;align-items:center;gap:8px}
.phase h3 small{font-family:Barlow,sans-serif;font-size:13px;font-weight:500;color:var(--muted)}
.items{list-style:none;padding:0;margin:8px 0 0;counter-reset:n}
.items>li{counter-increment:n;display:grid;grid-template-columns:34px 1fr;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.items>li::before{content:counter(n);font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:22px;color:var(--muted);text-align:center}
.items .dn{font-weight:700;font-size:17px}
.items .dose{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:17px;color:var(--navy);margin-left:6px}
:root[data-theme="dark"] .items .dose{color:#A9C2E6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .items .dose{color:#A9C2E6}}
.items .cn{margin-top:4px;font-size:15px}
.items .cn b{color:var(--red)}
.edrow{display:grid;grid-template-columns:1fr 160px 140px auto;gap:8px;margin-top:8px}
@media (max-width:640px){.edrow{grid-template-columns:1fr 1fr}.edrow .wide{grid-column:1/-1}}
.addbar{display:grid;grid-template-columns:1fr 180px auto;gap:8px;margin-top:12px}
@media (max-width:640px){.addbar{grid-template-columns:1fr}}
details.how summary{cursor:pointer;color:var(--muted);font-size:14px}
.nh{display:grid;grid-template-columns:90px 1fr 1fr 1fr 120px 110px;gap:8px}
@media (max-width:820px){.nh{grid-template-columns:1fr 1fr}}
.mlist{list-style:none;margin:0;padding:0;columns:2 300px;column-gap:20px}
.mlist li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line);break-inside:avoid}
video.demo{display:block;width:100%;max-width:420px;max-height:420px;border-radius:10px;background:#000;margin-top:8px}
.demo-link{display:inline-block;text-decoration:none;margin-top:4px}
details.how p{margin:6px 0 0;font-size:15px}

/* cage wars: the one loud moment — a netting field behind the challenge */
.cage{position:relative;overflow:hidden;border-radius:16px;background:var(--navy);color:#fff;padding:22px 20px 20px}
.cage::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:
   repeating-linear-gradient(45deg,var(--net) 0 2px,transparent 2px 26px),
   repeating-linear-gradient(-45deg,var(--net) 0 2px,transparent 2px 26px)}
.cage>*{position:relative}
.cage .wm{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:clamp(56px,13vw,124px);line-height:.85;letter-spacing:-.01em;color:transparent;-webkit-text-stroke:2px rgba(255,255,255,.85)}
.cage .wm::after{content:"";display:block;width:72px;height:6px;background:var(--red);margin-top:10px;border-radius:3px}
.cage .ch{margin-top:16px;padding-top:14px;border-top:2px solid rgba(255,255,255,.2)}
.cage .ch h2{font-size:clamp(28px,5vw,40px);line-height:1.05}
.cage .meta{font-size:14px;opacity:.8;margin-top:2px}
.cage .rules{margin:10px 0 0;max-width:62ch}
.cage .entry{margin-top:16px;display:grid;grid-template-columns:1.2fr .8fr 1.4fr auto;gap:8px}
@media (max-width:720px){.cage .entry{grid-template-columns:1fr 1fr}.cage .entry .wide{grid-column:1/-1}}
.cage select,.cage input{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.28);color:#fff}
.cage select option{color:#0D1B2E}
.cage input::placeholder{color:rgba(255,255,255,.6)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 11px;font-size:14px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--red);color:var(--red-ink)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:720px){.kpis{grid-template-columns:1fr 1fr}}
.kpi{background:var(--surface2);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column}
.kpi span{font-size:13px;color:var(--muted)}
.kpi b{font-family:"Barlow Condensed",sans-serif;font-size:34px;line-height:1.05}
.kpi small{font-size:13px;font-weight:600}
.charts2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:820px){.charts2{grid-template-columns:1fr}}
svg.chart{width:100%;height:auto;display:block;margin-top:4px}
.legend{font-size:13px;color:var(--muted);margin:4px 0 0;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sw{display:inline-block;width:14px;height:4px;border-radius:2px}
.sw.dash{background:repeating-linear-gradient(90deg,var(--muted) 0 5px,transparent 5px 9px);margin-left:8px}
.rep{border-top:1px solid var(--line);padding-top:12px}
.pickme{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.pickme:hover{border-color:var(--red)}
.pickme:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.pickme b{display:block;line-height:1.2}
.pickme:disabled{opacity:.45;cursor:not-allowed}
.cage .meprow{display:flex;align-items:center;padding:9px 12px;border-radius:10px;background:rgba(255,255,255,.18);font-weight:700}
.cage h3{color:#fff}
.linkbtn{background:none;border:0;padding:0;color:#fff;font-weight:700;text-decoration:underline;cursor:pointer}
.board{list-style:none;margin:0;padding:0}
.board li{display:grid;grid-template-columns:44px 1fr auto auto;gap:10px;align-items:center;padding:10px 4px;border-top:1px solid var(--line)}
.board li:first-child{border-top:0}
.rk{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:22px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--surface2)}
.rk.g{background:var(--gold);color:#1b1400}.rk.s{background:var(--silver);color:#10161e}.rk.b{background:var(--bronze);color:#fff}
.sc{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:26px;text-align:right}
.sc small{font-family:Barlow,sans-serif;font-size:13px;font-weight:500;color:var(--muted);margin-left:3px}
.cols{display:grid;grid-template-columns:1.1fr .9fr;gap:14px}
@media (max-width:820px){.cols{grid-template-columns:1fr}}
.hist{list-style:none;margin:0;padding:0}
.hist li{border-top:1px solid var(--line)}
.hist li:first-child{border-top:0}
.hist button{all:unset;cursor:pointer;display:flex;gap:10px;justify-content:space-between;width:100%;padding:10px 2px}
.hist button[aria-pressed="true"] b{color:var(--red)}
.pill{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface2);color:var(--muted)}
.pill.open{background:var(--red-soft);color:var(--red)}
table.st{width:100%;border-collapse:collapse;font-size:15px}
table.st th{font-size:13px;font-weight:600;color:var(--muted);text-align:right;padding:6px}
table.st th:nth-child(2),table.st td:nth-child(2){text-align:left}
table.st td{padding:8px 6px;border-top:1px solid var(--line);text-align:right}
table.st td.pts{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:20px}
.scroll{overflow-x:auto}

/* drills */
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.drill{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.drill h3{font-size:20px}
.drill .ph{font-size:13px;color:var(--muted)}
.drill p{margin:6px 0 0;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:12px;padding:3px 8px;border-radius:999px;background:var(--surface2);border:1px solid var(--line)}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters select{width:auto}
dialog{border:0;border-radius:16px;padding:0;max-width:560px;width:calc(100% - 24px);background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(5,12,22,.55)}
dialog form{padding:18px}
@media print{header.top,.noprint{display:none!important}body{background:#fff}main{padding:0}.panel{border:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---- pitching lab additions ---- */
:root{--chart1:#1F5FBF}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--chart1:#7FB2FF}}
:root[data-theme="dark"]{--chart1:#7FB2FF}
.ptabs{display:flex;gap:4px;border-bottom:2px solid var(--line);overflow-x:auto}
.ptabs a{padding:8px 14px 9px;text-decoration:none;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:20px;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.ptabs a[aria-current="page"]{color:var(--ink);border-color:var(--red)}
.sugg{background:var(--surface2);border:1px dashed var(--line);border-radius:10px;padding:10px 12px;font-size:15px;display:grid;gap:8px}
.chip.pick{font-size:14px;padding:6px 10px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip.pick:has(input:checked){background:var(--red-soft);border-color:var(--red)}
.fine{font-size:13px;margin:8px 0 0}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;margin-top:8px}
.tile{background:var(--surface2);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;min-width:0}
.tile b{font-family:"Barlow Condensed",sans-serif;font-size:24px;line-height:1.1;overflow-wrap:anywhere}
.tile span{font-size:12.5px;color:var(--muted)}
.srct{font:600 9px/1 Barlow,sans-serif;font-style:normal;margin-left:4px;padding:2px 4px;border-radius:4px;vertical-align:6px;background:var(--line);color:var(--muted)}
.kv2{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px 14px;margin-top:8px;font-size:14px}
.kv2 div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding:3px 0;font-weight:600}
.kv2 span{color:var(--muted);font-weight:400}
.pct-group{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:16px;color:var(--muted);margin:10px 0 2px;text-transform:uppercase;letter-spacing:.04em}
.pct-row{display:grid;grid-template-columns:150px 1fr 52px;gap:10px;align-items:center;padding:5px 0;font-size:15px}
@media (max-width:520px){.pct-row{grid-template-columns:112px 1fr 46px;font-size:14px}}
.pct-track{position:relative;height:8px;border-radius:4px;background:var(--surface2);margin:0 13px}
.pct-fill{position:absolute;left:0;top:0;bottom:0;border-radius:4px;opacity:.45}
.pct-dot{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;color:#fff;font:700 12px/26px Barlow,sans-serif;text-align:center}
.pct-v{text-align:right;font-weight:600}
.dsec{font-family:"Barlow Condensed",sans-serif;font-size:18px;margin:14px 0 4px}
.dtz{display:flex;height:26px;border-radius:8px;overflow:hidden;color:#fff;font:700 12px/26px Barlow,sans-serif;text-align:center}
.plots{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:860px){.plots{grid-template-columns:1fr 1fr}}
.plots.two{grid-template-columns:1fr 1fr}
@media (max-width:560px){.plots,.plots.two{grid-template-columns:1fr}}
.hmgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.hm{margin:0}
.hm svg{display:block;width:100%;height:auto}
.hm figcaption{font-size:13px;color:var(--muted);text-align:center;margin-top:4px}
.hm figcaption b{color:var(--ink);margin-right:4px}
.hmkey{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-top:8px}
.hmkey i{display:block;width:140px;height:10px;border-radius:5px;border:1px solid var(--line);background:linear-gradient(90deg,#fff,#C6DBEF,#6BAED6,#FDE078,#F48C32,#BE1028)}
.plotbox{background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px}
.plotbox svg{display:block;width:100%;height:auto;max-width:340px;margin:0 auto}
.plotlegend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--muted);margin-top:6px}
.plotlegend span{display:inline-flex;align-items:center;gap:5px}
.plotlegend i{display:inline-block;width:10px;height:10px;border-radius:50%}
table.tt{border-collapse:collapse;font-size:14px;min-width:100%}
table.tt th{color:#fff;font-weight:700;padding:5px 10px;min-width:54px;text-align:center}
table.tt th:first-child{background:none}
table.tt td{padding:5px 10px;border-top:1px solid var(--line);text-align:center;white-space:nowrap}
table.tt td:first-child{text-align:left;color:var(--muted)}
table.st.wide{font-size:14px;white-space:nowrap}
table.st.wide th:nth-child(2),table.st.wide td:nth-child(2){text-align:left}
table.st.lb{white-space:nowrap}
table.st.lb a{text-decoration:none}
table.st.lb a:hover b{color:var(--red)}
.ldrhead{font-size:22px;margin:10px 0 -4px}
.ldrgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.ldr{list-style:none;margin:8px 0 0;padding:0}
.ldr li{display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.ldr li:first-child{border-top:0}
.ldr li.me{background:var(--red-soft);border-radius:8px;padding-left:4px;padding-right:4px}
.ldr .lrk{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:18px;color:var(--muted);text-align:center}
.ldr li:first-child .lrk{color:var(--red)}
.ldr a{text-decoration:none;color:inherit}
.ldr a:hover b{color:var(--red)}
.ldr .sub{font-size:13px}
.ldr .lv{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:22px;font-variant-numeric:tabular-nums}
.ldr .lbar{height:5px;background:var(--surface2);border-radius:3px;margin-top:4px;overflow:hidden}
.ldr .lbar i{display:block;height:100%;background:linear-gradient(90deg,var(--navy),var(--red))}
table.st tr.tot td{border-top:2px solid var(--ink);font-weight:600}
.thb{all:unset;cursor:pointer;font:inherit;color:inherit}
.thb:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.mtgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-top:14px}
.mt h4{font-family:"Barlow Condensed",sans-serif;font-size:18px;margin:0}
.read{background:var(--surface2);border-radius:12px;padding:12px 14px;margin-top:14px}
.read h4{font-family:"Barlow Condensed",sans-serif;font-size:20px;margin:0 0 4px}
.read ul{margin:0;padding-left:18px}
.read li{margin:5px 0;font-size:15px}
video.demo.mech{max-width:560px;max-height:none}
.skel{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
@media (max-width:640px){.skel{grid-template-columns:repeat(3,1fr)}}
.skel figure{margin:0}
.skel svg{display:block;width:100%;height:auto;border-radius:10px}
.skel figcaption{font-size:13px;color:var(--muted);text-align:center;margin-top:3px}
.mitem{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.mitem:first-of-type{border-top:0}
.mitem b{display:block}
.mitem .sub{font-size:14px}
.ic{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--navy);color:#fff;font-weight:700;font-size:14px}
.mfocus{border-top:1px solid var(--line);padding-top:10px}
.mrow{padding:9px 0;border-top:1px solid var(--line)}
.mrow:first-of-type{border-top:0}
.mtop{display:flex;justify-content:space-between;gap:10px;font-size:15px}
.track{position:relative;height:8px;border-radius:4px;background:var(--surface2);margin:7px 8px 4px}
.track .band{position:absolute;top:0;bottom:0;background:var(--silver);opacity:.55;border-radius:4px}
.track .dot{position:absolute;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;border:2px solid var(--surface)}
</style>
</head>

<script>
/* ======================================================================
   ICC Labs core: Supabase sign-in, data layer, privacy helpers, Player Reports.
   Shared by the Hitting Lab and Pitching Lab. The page sets window.LAB first:
     LAB = {app:"hitting"|"pitching", name, short, roster(), byKey(k), ownerOf(coll, docId, data), start(db, user, assets)}
   ====================================================================== */
(function () {
"use strict";
const SUPABASE_URL = "https://bmqbpdflcfzhcnwusmlo.supabase.co";
const SUPABASE_KEY = "sb_publishable_yxI600Ad15FXHOok-B_5oA_OcvTmHhO";   /* public by design: the database rules decide who sees what */
const MEDIA = "lab-media";
const RECOVERY = /type=recovery/.test(location.hash + location.search);
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {auth: {persistSession: true, autoRefreshToken: true, detectSessionInUrl: true}});
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 10);
const C = window.CORE = {sb, user: null, me: null, coach: false, players: [], coaches: [], ready: false, reports: {}, reportsReady: false};

/* ---------- who owns what: match roster names to the players table ---------- */
const norm = s => String(s || "").toLowerCase().replace(/\([^)]*\)/g, "").replace(/[^a-z]/g, "");
let byName = new Map();
function indexPlayers() { byName = new Map(C.players.map(p => [norm(p.last_name) + "|" + norm(p.first_name), p.app_key])); }
C.ownerKeyOf = (first, last) => byName.get(norm(last) + "|" + norm(first)) || null;
C.myName = () => { const p = C.players.find(x => x.app_key === C.me); return p ? `${p.first_name} ${p.last_name}` : ""; };

/* ---------- data layer: a small Firestore-style API over the app_docs table ---------- */
const APP = () => window.LAB.app;
const split = path => { const i = path.lastIndexOf("/"); return [path.slice(0, i), path.slice(i + 1)]; };
const watchers = new Set();
const docSnap = (id, data) => ({id, exists: data !== undefined, data: () => data});
const collSnap = docs => { const list = Object.entries(docs).map(([id, d]) => ({id, exists: true, data: () => d})); return {docs: list, size: list.length, empty: !list.length, metadata: {fromCache: false}}; };
async function fetchDocs(app, coll, conds = [], docId = null) {
  const out = {}, size = 1000;
  for (let from = 0; ; from += size) {
    let q = sb.from("app_docs").select("doc_id,data").eq("app", app).eq("coll", coll);
    if (docId != null) q = q.eq("doc_id", docId);
    for (const [f, op, v] of conds) { const col = "data->>" + f; q = op === "==" ? q.eq(col, v) : op === ">=" ? q.gte(col, v) : op === "<=" ? q.lte(col, v) : q; }
    const {data, error} = await q.order("doc_id").range(from, from + size - 1);
    if (error) throw error;
    for (const r of data) out[r.doc_id] = r.data;
    if (data.length < size) break;
  }
  return out;
}
const matches = (d, conds) => conds.every(([f, op, v]) => { const x = d ? d[f] : undefined; return op === "==" ? x == v : op === ">=" ? x >= v : op === "<=" ? x <= v : true; });
function watch(w) {
  watchers.add(w);
  const load = () => fetchDocs(w.app, w.coll, w.conds, w.docId).then(d => { if (!watchers.has(w)) return; w.docs = d; w.emit(); }).catch(e => { console.error(e); w.err && w.err(e); });
  w.load = load; load();
  return () => watchers.delete(w);
}
function onChange(p) {
  const row = p.new && p.new.coll ? p.new : null, old = p.old || {};
  for (const w of watchers) {
    if (p.eventType === "DELETE") {
      if (w.app === old.app && w.coll === old.coll && old.doc_id in w.docs) { delete w.docs[old.doc_id]; w.emit(); }
      continue;
    }
    if (!row || row.app !== w.app || row.coll !== w.coll) continue;
    if (w.docId != null && row.doc_id !== w.docId) continue;
    if (matches(row.data, w.conds)) w.docs[row.doc_id] = row.data;
    else if (row.doc_id in w.docs) delete w.docs[row.doc_id];
    else continue;
    w.emit();
  }
}
const refreshAll = () => watchers.forEach(w => w.load && w.load());
function startLive() {
  let once = false;
  sb.channel("labs-" + APP()).on("postgres_changes", {event: "*", schema: "public", table: "app_docs"}, onChange)
    .subscribe(st => { if (st === "SUBSCRIBED") { if (once) refreshAll(); once = true; } });
  /* phones drop the live connection when they sleep: catch up when the app comes back */
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") refreshAll(); });
  addEventListener("online", refreshAll);
}
function withOwner(coll, id, data) {
  const d = JSON.parse(JSON.stringify(data ?? {}));
  const o = window.LAB.ownerOf(coll, id, d);
  if (o) d._owner = o; else delete d._owner;
  return d;
}
async function setDoc(app, coll, id, data) {
  const {error} = await sb.from("app_docs").upsert({app, coll, doc_id: id, data: withOwner(coll, id, data)}, {onConflict: "app,coll,doc_id"});
  if (error) throw Object.assign(error, {code: error.code === "42501" ? "permission_denied" : error.code});
}
async function delDoc(app, coll, id) {
  const {error} = await sb.from("app_docs").delete().eq("app", app).eq("coll", coll).eq("doc_id", id);
  if (error) throw error;
}
function docRef(path) {
  const [coll, id] = split(path);
  return {
    id,
    set: data => setDoc(APP(), coll, id, data),
    delete: () => delDoc(APP(), coll, id),
    get: async () => { const d = await fetchDocs(APP(), coll, [], id); return docSnap(id, d[id]); },
    onSnapshot(cb, err) { return watch({app: APP(), coll, docId: id, conds: [], docs: {}, err, emit() { cb(docSnap(id, this.docs[id])); }}); }
  };
}
function query(coll, conds) {
  return {
    where: (f, op, v) => query(coll, [...conds, [f, op, v]]),
    get: async () => collSnap(await fetchDocs(APP(), coll, conds)),
    doc: id => docRef(coll + "/" + id),
    onSnapshot(cb, err) { return watch({app: APP(), coll, docId: null, conds, docs: {}, err, emit() { cb(collSnap(this.docs)); }}); }
  };
}
C.db = {collection: path => query(path, []), doc: docRef};
C.setDoc = setDoc;
C.fetchDocs = fetchDocs;

/* the Claude-era "user" object, answered from the login */
C.userApi = {
  isOwner: async () => C.coach,
  can: async () => true,
  id: async () => C.user ? C.user.id : null,
  profiles: async ids => {
    const out = {};
    for (const id of ids) {
      const p = C.players.find(x => x.user_id === id), c = C.coaches.find(x => x.user_id === id);
      if (p) out[id] = {name: `${p.first_name} ${p.last_name}`}; else if (c) out[id] = {name: c.name}; else if (C.user && id === C.user.id) out[id] = {name: C.myName() || "you"};
    }
    return out;
  }
};
/* drill demo videos live in Supabase Storage (public bucket, coaches upload) */
C.mediaUrl = id => `${SUPABASE_URL}/storage/v1/object/public/${MEDIA}/${String(id).split("/").map(encodeURIComponent).join("/")}`;
C.assets = {
  upload: async blob => {
    const ext = ((blob.type || "").split("/")[1] || "mp4").replace(/[^a-z0-9]/gi, "").slice(0, 5) || "mp4";
    const path = `${APP()}/${Date.now()}-${uid()}.${ext}`;
    const {error} = await sb.storage.from(MEDIA).upload(path, blob, {contentType: blob.type || "video/mp4", upsert: false, cacheControl: "31536000"});
    if (error) throw Object.assign(new Error(error.message), {code: /size|large/i.test(error.message) ? "too_large" : "upload_failed"});
    return {id: path};
  },

    <section class="panel stack">

/* ---------- coach: bring over data from the Claude version ---------- */
C.importHtml = () => `<section class="panel stack noprint"><h2 style="font-size:22px">Bring over your data from the Claude version</h2>
  <p class="sub" style="margin:0">Open the <b>${esc(window.LAB.app)}-import</b> folder and select <b>everything in it</b> (Ctrl+A on Windows, Cmd+A on Mac): the data file plus the videos. It brings in routines, drills, scores, game data and videos. Safe to run twice.</p>
  <div class="row"><input type="file" id="labImport" multiple accept=".json,application/json,video/*" style="max-width:340px"><span class="sub" id="labImportMsg"></span></div></section>`;
document.addEventListener("change", async e => {
  if (e.target.id !== "labImport" || !e.target.files.length || !C.coach) return;
  const msg = $("#labImportMsg"), files = [...e.target.files], f = files.find(x => /\.json$/i.test(x.name));
  try {
    const vidsOnly = files.filter(x => /\.(mp4|mov|webm|m4v)$/i.test(x.name));
    if (!f && vidsOnly.length) {
      /* videos only: replace the clips the earlier import put in Storage (same names), nothing else changes */
      let v = 0;
      for (const vf of vidsOnly) {
        msg.textContent = `Replacing video ${++v} of ${vidsOnly.length}…`;
        const {error} = await sb.storage.from(MEDIA).upload(`${APP()}/legacy/${vf.name}`, vf, {contentType: vf.type || "video/mp4", upsert: true, cacheControl: "31536000"});
        if (error) throw new Error("Video " + vf.name + ": " + error.message);
      }
      msg.textContent = `Done: ${vidsOnly.length} videos replaced. Nothing else was changed.`; e.target.value = ""; return;
    }
    if (!f) throw new Error("Include the " + window.LAB.app + "-lab-data.json file.");
    const j = JSON.parse(await f.text());
    if (j.app !== window.LAB.app || !Array.isArray(j.docs)) throw new Error(`That file is for the ${j.app || "wrong"} app.`);
    if (window.LAB.prime) window.LAB.prime(j.docs);
    /* videos picked along with the data file go to Storage; the docs point at them */
    const vids = files.filter(x => /\.(mp4|mov|webm|m4v)$/i.test(x.name)), have = {};
    let v = 0;
    for (const vf of vids) {
      const id = vf.name.replace(/\.[^.]+$/, ""), path = `${j.app}/legacy/${vf.name}`;
      msg.textContent = `Uploading video ${++v} of ${vids.length}…`;
      const {error} = await sb.storage.from(MEDIA).upload(path, vf, {contentType: vf.type || "video/mp4", upsert: true, cacheControl: "31536000"});
      if (error) throw new Error("Video " + vf.name + ": " + error.message);
      have[id] = path;
    }
    let missing = 0;
    for (const d of j.docs) for (const fld of ["videoAsset", "markerVideo"]) {
      const val = d.data && d.data[fld];
      if (typeof val === "string" && /^[0-9a-f]{32}$/.test(val)) { if (have[val]) d.data[fld] = have[val]; else { d.data[fld] = ""; missing++; } }
    }
    let n = 0;
    for (let i = 0; i < j.docs.length; i += 40) {
      const rows = j.docs.slice(i, i + 40).map(d => ({app: j.app, coll: d.coll, doc_id: d.doc_id, data: withOwner(d.coll, d.doc_id, d.data)}));
      const {error} = await sb.from("app_docs").upsert(rows, {onConflict: "app,coll,doc_id"});
      if (error) throw error;
      n += rows.length; msg.textContent = `Saved ${n} of ${j.docs.length}…`;
    }
    msg.textContent = `Done: ${n} items brought over` + (vids.length ? `, ${vids.length} videos` : "") + (missing ? `. ${missing} video${missing === 1 ? " wasn't" : "s weren't"} included, so re-upload ${missing === 1 ? "it" : "those"} in the Lab.` : ".");  refreshAll();
  } catch (err) { console.error(err); msg.textContent = "Import stopped: " + (err.message || err); }
  e.target.value = "";
});

/* ---------- sign-in screens ---------- */
function authCard(inner) {
  return `<div style="max-width:440px;margin:20px auto 0"><section class="panel stack">${inner}</section></div>`;
}
function renderAuth(view, note) {
  C.authView = view = view || C.authView || "in";
  document.querySelectorAll("nav.tabs").forEach(n => n.hidden = true);
  const email = `<div><label class="f" for="aEmail">Email</label><input id="aEmail" type="email" autocomplete="email" inputmode="email" value="${esc(C.authEmail || "")}" required></div>`;
  const pw = (lbl, ac) => `<div><label class="f" for="aPass">${lbl}</label><input id="aPass" type="password" autocomplete="${ac}" minlength="6" required></div>`;
  const title = `<div><h1 style="font-size:32px">${esc(window.LAB.name)}</h1><p class="sub" style="margin:2px 0 0">Itawamba CC Baseball</p></div>`;
  let body;
  if (view === "in") body = `${title}<p style="margin:0">Sign in with the email your coach put on the roster. It's the same login as the Weight Room.</p><form id="aForm" class="stack">${email}${pw("Password", "current-password")}<div class="row"><button class="btn" type="submit">Sign in</button></div></form>
    <div class="row" style="gap:16px"><button class="linkbtn" style="color:var(--red)" data-auth="up">First time? Create your account</button><button class="linkbtn" style="color:var(--red)" data-auth="forgot">Forgot password</button></div>`;
  else if (view === "up") body = `${title}<p style="margin:0">Use the email your coach has on the roster. That's how the app knows who you are.</p><form id="aForm" class="stack">${email}${pw("Make a password (6+ characters)", "new-password")}<div class="row"><button class="btn" type="submit">Create account</button></div></form>
    <button class="linkbtn" style="color:var(--red);align-self:flex-start" data-auth="in">Already have an account? Sign in</button>`;
  else if (view === "forgot") body = `${title}<p style="margin:0">We'll email you a link to set a new password.</p><form id="aForm" class="stack">${email}<div class="row"><button class="btn" type="submit">Send link</button></div></form>
    <button class="linkbtn" style="color:var(--red);align-self:flex-start" data-auth="in">Back to sign in</button>`;
  else body = `${title}<p style="margin:0">Choose a new password.</p><form id="aForm" class="stack">${pw("New password (6+ characters)", "new-password")}<div class="row"><button class="btn" type="submit">Save password</button></div></form>`;
  $("#app").innerHTML = authCard(body + (note ? `<p class="note" style="margin:0">${esc(note)}</p>` : ""));
  document.querySelectorAll("[data-auth]").forEach(x => x.onclick = () => { C.authEmail = ($("#aEmail") || {}).value || C.authEmail; renderAuth(x.dataset.auth); });
  $("#aForm").onsubmit = async ev => {
    ev.preventDefault();
    const btn = $("#aForm button[type=submit]"); btn.disabled = true;
    const em = ($("#aEmail") || {}).value?.trim(), pass = ($("#aPass") || {}).value;
    C.authEmail = em || C.authEmail;
    const back = location.origin + location.pathname;
    try {
      if (view === "in") { const {error} = await sb.auth.signInWithPassword({email: em, password: pass}); if (error) throw error; return; }
      if (view === "up") {
        const {data, error} = await sb.auth.signUp({email: em, password: pass, options: {emailRedirectTo: back}}); if (error) throw error;
        if (!data.session) { renderAuth("in", "Check your email and tap the link to finish creating your account. Then sign in here."); return; }
        return;
      }
      if (view === "forgot") { const {error} = await sb.auth.resetPasswordForEmail(em, {redirectTo: back}); if (error) throw error; renderAuth("in", "If that email has an account, a reset link is on its way."); return; }
      const {error} = await sb.auth.updateUser({password: pass}); if (error) throw error;
      C.authView = "in"; const {data: {session}} = await sb.auth.getSession(); if (session) { history.replaceState(null, "", location.pathname); startSession(session); }
    } catch (err) {
      const m = String(err && err.message || err);
      renderAuth(view, /invalid login/i.test(m) ? "That email and password don't match. Try again or reset your password."
        : /not confirmed/i.test(m) ? "Your email isn't confirmed yet. Tap the link in the email we sent you."
        : /already registered/i.test(m) ? "That email already has an account. Sign in instead." : m);
    }
  };
}
function noAccess(why) {
  document.querySelectorAll("nav.tabs").forEach(n => n.hidden = true);
  $("#app").innerHTML = authCard(`<h1 style="font-size:30px">${esc(window.LAB.name)}</h1>
    <p style="margin:0">You're signed in as <b>${esc(C.user.email)}</b>, but ${why}</p>
    <p class="sub" style="margin:0">Ask a coach to check your email and position in the Weight Room (Settings › Player logins). Then tap Try again.</p>
    <div class="row"><button class="btn" id="naRetry">Try again</button><button class="btn ghost" id="naOut">Sign out</button></div>`);
  $("#naRetry").onclick = () => location.reload();
  $("#naOut").onclick = C.signOut;
}
C.signOut = async () => { try { await sb.auth.signOut(); } catch (e) {} location.hash = ""; location.reload(); };

let started = false;
async function startSession(session) {
  if (started) return; started = true;
  C.user = session.user;
  const [k, c, u] = await Promise.all([sb.rpc("my_player_key"), sb.rpc("is_coach"), sb.rpc("can_use_app", {p_app: APP()})]);
  if (k.error || c.error || u.error) console.error(k.error || c.error || u.error);
  C.me = k.data || null; C.coach = c.data === true;
  if (!C.coach && !C.me) { noAccess("that email isn't on the team roster yet."); return; }
  if (!C.coach && u.data !== true) { noAccess(`the ${esc(window.LAB.name)} is for ${APP() === "hitting" ? "hitters and two-way players" : "pitchers and two-way players"}. If that's wrong, a coach can fix your position.`); return; }
  const [pl, co] = await Promise.all([sb.from("players").select("app_key,first_name,last_name,jersey,position,user_id,active"), sb.from("coaches").select("name,user_id")]);
  C.players = (pl.data || []); C.coaches = (co.data || []); indexPlayers();
  document.querySelectorAll("nav.tabs").forEach(n => n.hidden = false);
  const role = $("#role"); if (role) { role.hidden = false; }
  const out = document.createElement("button"); out.type = "button"; out.className = "role"; out.id = "signOut"; out.textContent = "Sign out"; out.style.cssText = "border:0;cursor:pointer;color:inherit;margin-left:6px";
  out.onclick = C.signOut; (role || $(".bar")).after(out);
  C.ready = true;
  startLive(); watchReports();
  window.LAB.start(C.db, C.userApi, C.assets);
  refreshBadge(); importBox();
}
C.boot = async function () {
  if (RECOVERY) C.authView = "reset";
  sb.auth.onAuthStateChange((ev, session) => setTimeout(() => {
    if (ev === "PASSWORD_RECOVERY") { started = false; renderAuth("reset"); return; }
    if (ev === "SIGNED_OUT") { if (C.ready) location.reload(); return; }
    if (session && !started && C.authView !== "reset") startSession(session);
  }, 0));
  const {data: {session}} = await sb.auth.getSession();
  if (session && C.authView !== "reset") startSession(session); else renderAuth(C.authView);
};
C.refreshBadge = refreshBadge;
})();

/* the live roster = fall roster minus pitchers the staff removed, plus pitchers the staff added (stored in staff/pit/roster) */
let PITCHERS = BASE_PITCHERS, byNo = Object.fromEntries(BASE_PITCHERS.map(h => [h.key, h]));
function makePitcher(x){ return {no:x.no, key:x.key, name:`${x.last}, ${x.first}`, first:x.first, last:x.last, short:`${x.first} ${x.last}`, pos:x.pos || "", thr:x.thr || "R", cl:x.cl || "", ht:"", wt:"", inches:72, added:true}; }
function allKnownPitchers(){ return [...BASE_PITCHERS, ...Object.values(S.roster || {}).filter(x => x.added).map(makePitcher)]; }
function rebuildRoster(){
  const ov = S.roster || {};
  PITCHERS = allKnownPitchers().filter(h => !(ov[h.key] && ov[h.key].removed)).sort((a,b) => a.no - b.no || a.last.localeCompare(b.last));
  byNo = Object.fromEntries(PITCHERS.map(h => [h.key, h]));
}

/* toast with an optional Undo action */
function toast(msg, undo){
  document.querySelectorAll(".toast").forEach(t => t.remove());
  const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status");
  t.append(msg);
  if (undo) { const u = document.createElement("button"); u.type = "button"; u.textContent = "Undo"; u.style.cssText = "margin-left:12px;background:none;border:0;color:#fff;font-weight:700;text-decoration:underline;cursor:pointer"; u.onclick = () => { t.remove(); undo(); }; t.append(u); }
  document.body.appendChild(t); setTimeout(() => t.remove(), undo ? 6000 : 3000);
}
/* in-page confirm: the browser's confirm() box is blocked inside published pages */
function askConfirm(msg, ok){
  return new Promise(res => {
    const d = document.getElementById("cfm");
    document.getElementById("cfmMsg").textContent = msg;
    document.getElementById("cfmOk").textContent = ok || "Yes";
    d.returnValue = "";
    d.onclose = () => res(d.returnValue === "yes");
    d.showModal();
  });
}

/* one write at a time per document; text edits coalesce */
const queues = {}, timers = {};
function write(path, data, del){
  const run = async () => {
    try { del ? await S.db.doc(path).delete() : await S.db.doc(path).set(data); }
    catch (e) { console.error(e); if (e && e.code === "invalid_argument") { S.canWrite = false; } toast(`That change didn't save (${(e && e.code) || "unknown error"}). If this keeps happening, tell the head coach this message.`); }
  };
  queues[path] = (queues[path] || Promise.resolve()).then(run);
  return queues[path];
}
function writeSoon(path, getData){ clearTimeout(timers[path]); timers[path] = setTimeout(() => write(path, getData()), 700); }

}

const mkItem = id => { const d = drillById(id); return d ? {id:uid(), drill:id, phase:d.phase, dose:d.dose, note:""} : null; };
/* arm care, then the first 3 drills from the bank for his focus, then recovery; more can be added by hand */
function buildFromFlaw(flawId){ const f = flawById[flawId]; return ["jband", "catch-play", ...f.drills.slice(0, 3), "post-band"].map(mkItem).filter(Boolean); }
/* two drills for each tight area the staff ticked; a general flow if none are ticked */
function buildMobility(areas){

function drillOptions(r, selected, mob){

  if (rec.length) o += `<optgroup label="${mob ? "Recommended for his tight areas" : `Recommended for ${esc(f.name)}`}">${rec.map(id => { const d = drillById(id); return d ? `<option value="${d.id}" ${selected === d.id ? "selected" : ""}>${esc(d.name)}</option>` : ""; }).join("")}</optgroup>`;
  for (const ph of (mob ? ["Mobility", ...ROUTINE_PHASES] : PHASES)) {

}
const throwsTxt = h => h.thr === "L" ? "LHP" : "RHP";

/* what the mo-cap and the Trackman numbers point to; the coach decides */
function suggestions(h){
  const out = [], cap = capsFor(h)[0];
  if (cap) {
    const fb = cap.auto || rulesFeedback(cap);
    const fix = (fb.fixes || []).find(x => flawByTag[x.tag]);
    const cf = cap.coach && cap.coach.focus && cap.coach.focus[0], ct = cf && Object.keys(MECH_TAGS).find(t => MECH_TAGS[t] === cf.title);
    if (ct && flawByTag[ct]) out.push({flaw:flawByTag[ct].id, src:`Coach's plan in the Mechanics Lab (${fmtMD(cap.date)})`, why:cf.why || ""});
    else if (fix) out.push({flaw:flawByTag[fix.tag].id, src:`Mo-cap (${fmtMD(cap.date)})`, why:fix.detail || ""});
  }
  const p = S.model && S.model.pitchers[h.key], tm = S.model && S.model.team;
  if (p && tm && p.st.pitches >= 30) {
    const st = p.st, gap = k => st[k] != null && tm[k] != null ? st[k] - tm[k] : 0;
    const c = [
      ["command", Math.min(gap("strike"), gap("comp")), `Strike% ${fpc(st.strike)} and Comp% ${fpc(st.comp)}. The staff is at ${fpc(tm.strike)} and ${fpc(tm.comp)}.`],
      ["ahead", Math.min(gap("fps"), gap("ea")), `First-pitch strikes ${fpc(st.fps)} and E+A ${fpc(st.ea)}. The staff is at ${fpc(tm.fps)} and ${fpc(tm.ea)}.`],
      ["putaway", gap("whiff"), `Whiff% ${fpc(st.whiff)}. The staff is at ${fpc(tm.whiff)}.`]
    ].sort((a, b) => a[1] - b[1])[0];
    if (c[1] <= -4) out.push({flaw:c[0], src:`Trackman (${st.pitches} pitches)`, why:c[2]});
  }
  return out;
}
function suggestHtml(h, r){
  const s = suggestions(h).filter(x => x.flaw !== r.flaw);

function mobSuggest(h, r){

}

function challengesSorted(){ return Object.values(S.challenges).sort((a,b) => (b.date || "").localeCompare(a.date || "") || (b.createdAt || 0) - (a.createdAt || 0)); }
function scoresFor(cid){
  const ch = S.challenges[cid]; if (!ch) return [];
  const list = Object.values(S.scores).filter(s => s.cid === cid && byNo[s.no] && typeof s.score === "number");
  list.sort((a,b) => ch.better === "low" ? a.score - b.score : b.score - a.score);
  let rank = 0, prev = null;
  list.forEach((s, i) => { if (s.score !== prev) { rank = i + 1; prev = s.score; } s.rank = rank; });
  return list;
}
function standings(range){
  const t = {};
  for (const ch of Object.values(S.challenges)) {
    if (!inRange(ch.date, range)) continue;
    for (const s of scoresFor(ch.id)) {
      const row = t[s.no] || (t[s.no] = {no:s.no, pts:0, wins:0, podium:0, played:0});
      row.pts += s.rank <= POINTS.length ? POINTS[s.rank - 1] : 1;
      row.played++; if (s.rank === 1) row.wins++; if (s.rank <= 3) row.podium++;
    }
  }
  return Object.values(t).sort((a,b) => b.pts - a.pts || b.wins - a.wins || b.podium - a.podium);
}

/* ---------- print: build a one-player routine PDF (the browser print box is blocked inside published pages) ---------- */
async function printRoutine(key, btn){
  const h = byNo[key], r = routineOf(key), f = flawById[r.flaw], f2 = flawById[r.flaw2];
  if (!window.jspdf) { toast("The printer tool didn't load. Check your connection and reload."); return; }
  const dl = window.claude && window.claude.use ? await window.claude.use("downloads").catch(() => null) : null;
  if (!dl) { window.print(); return; }
  const label = btn.textContent; btn.disabled = true; btn.textContent = "Building PDF…";
  try {
    const doc = new window.jspdf.jsPDF({unit:"pt", format:"letter"});
    const W = 612, M = 46, CW = W - M * 2, BOTTOM = 792 - 50;
    const NAVY = [13,35,63], RED = [209,10,10], INK = [13,27,46], MUTED = [86,99,122], LINE = [211,218,228];
    let y = 0;
    const header = () => {
      doc.setFillColor(...NAVY); doc.rect(0, 0, W, 64, "F");
      try { doc.addImage(document.querySelector(".bar img").src, "PNG", M, 14, 34, 36); } catch (e) {}
      doc.setTextColor(255,255,255); doc.setFont("helvetica","bold"); doc.setFontSize(17); doc.text("ITAWAMBA PITCHING LAB", M + 46, 35);
      doc.setFont("helvetica","normal"); doc.setFontSize(10); doc.text("Pitcher plan", M + 46, 50);
      doc.setFillColor(...RED); doc.rect(0, 64, W, 4, "F");
      y = 96;
    };
    const room = need => { if (y + need > BOTTOM) { doc.addPage(); header(); } };
    const para = (txt, size, color, style, gap) => {
      doc.setFont("helvetica", style || "normal"); doc.setFontSize(size); doc.setTextColor(...color);
      const lines = doc.splitTextToSize(String(txt), CW - (gap || 0));
      lines.forEach(l => { room(size * 1.35); doc.text(l, M + (gap || 0), y); y += size * 1.35; });
    };
    header();
    doc.setFillColor(...NAVY); doc.roundedRect(M, y - 4, 46, 46, 6, 6, "F");
    doc.setTextColor(255,255,255); doc.setFont("helvetica","bold"); doc.setFontSize(22); doc.text(String(h.no), M + 23, y + 27, {align:"center"});
    doc.setTextColor(...INK); doc.setFontSize(24); doc.text(h.short, M + 60, y + 18);
    doc.setFont("helvetica","normal"); doc.setFontSize(11); doc.setTextColor(...MUTED);
    doc.text(`${h.pos}  |  ${throwsTxt(h)}  |  ${h.cl}  |  Printed ${new Date().toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"})}`, M + 60, y + 36);
    y += 70;
    if (f) {
      const own = typeof r.feedback === "string" && r.feedbackFor === r.flaw;
      const fb = own ? r.feedback : f.what, cue = r.cue || f.cue;
      const top = y - 14;
      para("PLAYER FOCUS", 9, MUTED, "bold", 14);
      para(f.name, 18, INK, "bold", 14);
      if (f2) para(`Also working on: ${f2.name}`, 10.5, MUTED, "normal", 14);
      y += 2; if (fb) para(fb, 11, INK, "normal", 14);
      if (cue) { y += 4; para(`\u201c${cue}\u201d`, 15, RED, "bold", 14); }
      if (r.notes) { y += 2; para(`Coach: ${r.notes}`, 11, INK, "normal", 14); }
      doc.setFillColor(...RED); doc.rect(M, top, 4, y - top - 4, "F");
      y += 14;
    } else { para("No routine has been built yet.", 12, MUTED); }
    if (r.mobAreas.length || r.mobNotes) {

/* ---------- demo video prep: re-record any phone clip (.mov, huge files) as a small MP4/WebM that fits the 20 MB limit ---------- */
const MAX_VIDEO = 20 * 1024 * 1024;
function shrinkVideo(file, onProgress){
  return new Promise((resolve, reject) => {
    if (typeof MediaRecorder === "undefined") return reject({code:"no_recorder"});
    const mime = ["video/mp4;codecs=avc1", "video/mp4", "video/webm;codecs=vp9", "video/webm;codecs=vp8", "video/webm"].find(t => MediaRecorder.isTypeSupported(t));
    if (!mime) return reject({code:"no_recorder"});
    const url = URL.createObjectURL(file);
    const v = document.createElement("video");
    v.muted = true; v.playsInline = true; v.preload = "auto"; v.src = url;
    v.style.cssText = "position:fixed;left:-9999px;width:2px;height:2px";
    document.body.appendChild(v);
    const done = () => { URL.revokeObjectURL(url); v.remove(); };
    v.onerror = () => { done(); reject({code:"cant_read"}); };
    v.onloadedmetadata = () => {
      const dur = v.duration;
      if (!isFinite(dur) || dur <= 0) { done(); return reject({code:"cant_read"}); }
      if (dur > 180) { done(); return reject({code:"too_long"}); }
      const scale = Math.min(1, 720 / Math.max(v.videoWidth || 720, v.videoHeight || 720));
      const c = document.createElement("canvas");
      c.width = Math.round((v.videoWidth || 720) * scale / 2) * 2; c.height = Math.round((v.videoHeight || 1280) * scale / 2) * 2;
      const g = c.getContext("2d");
      /* aim for ~17 MB so there is headroom under the 20 MB cap */
      const bps = Math.max(400000, Math.min(2500000, Math.floor(17 * 1024 * 1024 * 8 / dur)));
      let recr;
      try { recr = new MediaRecorder(c.captureStream(30), {mimeType:mime, videoBitsPerSecond:bps}); }
      catch (e) { done(); return reject({code:"no_recorder"}); }
      const chunks = [];
      recr.ondataavailable = ev => { if (ev.data && ev.data.size) chunks.push(ev.data); };
      recr.onstop = () => { done(); const out = new Blob(chunks, {type: mime.split(";")[0]}); out.size > MAX_VIDEO ? reject({code:"too_large"}) : resolve(out); };
      let running = true;
      const draw = () => { if (!running) return; g.drawImage(v, 0, 0, c.width, c.height); onProgress && onProgress(Math.min(1, v.currentTime / dur)); requestAnimationFrame(draw); };
      v.onended = () => { running = false; g.drawImage(v, 0, 0, c.width, c.height); setTimeout(() => recr.state !== "inactive" && recr.stop(), 150); };
      recr.start(1000);
      v.play().then(draw).catch(() => { running = false; try { recr.stop(); } catch (e) {} reject({code:"cant_read"}); });
    };
  });
}

/* ---------- Bullpen Wars progress over time ---------- */
const parseD = s => { const [y,m,d] = (s || "").split("-").map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const weekStart = s => { const d = parseD(s); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return ymd(d); };   /* Monday */
function periodKey(s, tf){ return tf === "day" ? s : tf === "week" ? weekStart(s) : s.slice(0, 7); }
function periodLabel(k, tf){
  if (tf === "month") { const [y,m] = k.split("-").map(Number); return new Date(y, m - 1, 1).toLocaleDateString(undefined, {month:"short", year:"2-digit"}); }
  const t = parseD(k).toLocaleDateString(undefined, {month:"short", day:"numeric"});
  return tf === "week" ? `Wk ${t}` : t;
}
function inRange(date, range){
  if (!range || range === "season") return true;
  const t = today();
  return range === "week" ? weekStart(date) === weekStart(t) : (date || "").slice(0, 7) === t.slice(0, 7);
}
function segHtml(act, cur, opts){ return `<span class="seg noprint" role="group">${opts.map(([v, l]) => `<button data-act="${act}" data-v="${v}" aria-pressed="${cur === v}">${l}</button>`).join("")}</span>`; }
const ptsFor = rank => rank <= POINTS.length ? POINTS[rank - 1] : 1;
/* every Bullpen Wars entry for one pitcher, with place, field size, points and percentile (share of the field he beat) */
function historyOf(key){
  const out = [];
  for (const ch of Object.values(S.challenges)) {
    const list = scoresFor(ch.id), me = list.find(s => s.no === key);
    if (!me) continue;
    const n = list.length, avg = list.reduce((a, s) => a + s.score, 0) / n;
    out.push({ch, date:ch.date, score:me.score, rank:me.rank, n, pts:ptsFor(me.rank), pct: n > 1 ? Math.round((n - me.rank) / (n - 1) * 100) : 100, avg});
  }
  return out.sort((a, b) => a.date.localeCompare(b.date) || (a.ch.createdAt || 0) - (b.ch.createdAt || 0));
}
/* simple inline charts, drawn as SVG so they follow light/dark mode */
function barChart(labels, vals, unit){
  const W = 380, H = 190, L = 8, B = 30, T = 18, max = Math.max(1, ...vals.map(v => v || 0));
  const bw = (W - L - 8) / Math.max(labels.length, 1);
  let g = `<line x1="${L}" y1="${H - B}" x2="${W - 6}" y2="${H - B}" stroke="var(--line)"/>`;
  labels.forEach((lb, i) => {
    const v = vals[i] || 0, h = (H - B - T) * v / max, x = L + i * bw + bw * .16, w = bw * .68;
    g += `<rect x="${x.toFixed(1)}" y="${(H - B - h).toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="var(--red)"/>`;
    g += `<text x="${(x + w / 2).toFixed(1)}" y="${(H - B - h - 4).toFixed(1)}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">${v ? fmtNum(v) : "–"}</text>`;
    const step = Math.ceil(labels.length / 6);
    if (i === labels.length - 1 || (i % step === 0 && labels.length - 1 - i >= step)) g += `<text x="${(x + w / 2).toFixed(1)}" y="${H - B + 16}" text-anchor="middle" font-size="11" fill="var(--muted)">${esc(lb)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="${esc(unit)} by period">${g}</svg>`;
}
function lineChart(labels, series, opts){
  const W = opts.w || 380, H = opts.h || 190, L = 36, R = 24, B = 30, T = 14;
  const all = series.flatMap(s => s.values).filter(v => v != null);
  let lo = opts.min != null ? opts.min : Math.min(...all), hi = opts.max != null ? opts.max : Math.max(...all);
  if (lo === hi) { lo -= 1; hi += 1; }
  const pad = opts.min != null ? 0 : (hi - lo) * .12; lo -= pad; hi += pad;
  const X = i => L + (labels.length === 1 ? (W - L - R) / 2 : i * (W - L - R) / (labels.length - 1)), Y = v => T + (H - B - T) * (1 - (v - lo) / (hi - lo));
  let g = "";
  const ticks = opts.min != null ? [lo, (lo + hi) / 2, hi] : [lo + (hi - lo) * .1, (lo + hi) / 2, hi - (hi - lo) * .1];
  ticks.forEach(v => { g += `<line x1="${L}" x2="${W - R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="var(--line)" stroke-dasharray="3 4"/><text x="${L - 6}" y="${(Y(v) + 4).toFixed(1)}" text-anchor="end" font-size="11" fill="var(--muted)">${fmtNum(Math.round(v * 10) / 10)}${opts.suffix || ""}</text>`; });
  const step = Math.ceil(labels.length / (W > 500 ? 9 : 5));
  labels.forEach((lb, i) => { if (i % step === 0 || i === labels.length - 1) { const anc = labels.length > 1 && i === labels.length - 1 ? "end" : labels.length > 1 && i === 0 ? "start" : "middle"; g += `<text x="${(X(i) + (anc === "end" ? 6 : anc === "start" ? -6 : 0)).toFixed(1)}" y="${H - B + 18}" text-anchor="${anc}" font-size="11" fill="var(--muted)">${esc(lb)}</text>`; } });
  series.forEach(s => {
    let d = "", pen = false;
    s.values.forEach((v, i) => { if (v == null) { pen = false; return; } d += `${pen ? "L" : "M"}${X(i).toFixed(1)} ${Y(v).toFixed(1)} `; pen = true; });
    g += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.dash ? 2 : 3}" ${s.dash ? 'stroke-dasharray="6 5"' : ""} stroke-linejoin="round" stroke-linecap="round"/>`;
    if (!s.dash) s.values.forEach((v, i) => { if (v != null) g += `<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="4.5" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`; });
  });
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="${esc(opts.label || "trend")}">${g}</svg>`;
}

  const kpis = `<div class="kpis">
    <div class="kpi"><span>Points, ${nowWord}</span><b>${sum(cur)}</b>${delta(sum(cur), prev ? sum(prev) : null, "")}</div>
    <div class="kpi"><span>Beat the field, ${nowWord}</span><b>${avgPct(cur) == null ? "–" : avgPct(cur) + "%"}</b>${delta(avgPct(cur), prev ? avgPct(prev) : null, " pts")}</div>
    <div class="kpi"><span>Wins</span><b>${wins}</b><small class="sub">${hist.filter(e => e.rank <= 3).length} top-3 finishes</small></div>
    <div class="kpi"><span>Showed up</span><b>${entered}/${totalCh}</b><small class="sub">challenges posted</small></div></div>`;

  /* same challenge run more than once: his raw scores vs the team average */
  const groups = {}; hist.forEach(e => { const t = e.ch.title.trim().toLowerCase(); (groups[t] = groups[t] || []).push(e); });
  const repeat = Object.values(groups).filter(g => g.length >= 2).sort((a, b) => b.length - a.length);
  const repeatHtml = repeat.map(g => {
    const c = g[g.length - 1].ch, lowWins = c.better === "low", first = g[0].score, last = g[g.length - 1].score;
    const best = lowWins ? Math.min(...g.map(e => e.score)) : Math.max(...g.map(e => e.score));
    const better = lowWins ? last < first : last > first, same = last === first;
    return `<div class="rep"><div class="row" style="justify-content:space-between"><h3 style="font-size:20px">${esc(c.title)}</h3>
      <span class="sub" style="font-size:14px">Best ${fmtNum(best)} ${esc(c.unit)}. ${same ? "Even with his first try." : `<b style="color:${better ? "var(--good)" : "var(--red)"}">${better ? "▲ Up" : "▼ Down"} ${fmtNum(Math.abs(last - first))} ${esc(c.unit)}</b> since the first one.`}</span></div>
      ${lineChart(g.map(e => fmtDate(e.date).replace(/^\w+, /, "")), [{values:g.map(e => Math.round(e.avg * 10) / 10), color:"var(--muted)", dash:true}, {values:g.map(e => e.score), color:"var(--red)"}], {label:`${c.title} scores`, w:900, h:220})}
      <p class="legend"><span class="sw" style="background:var(--red)"></span>${playerMode ? "You" : esc(h.first)} <span class="sw dash"></span>Team average${lowWins ? ". Lower is better on this one." : ""}</p></div>`;
  }).join("");

  const log = `<details class="how"><summary>Every entry (${hist.length})</summary><div class="scroll"><table class="st" style="margin-top:6px"><thead><tr><th style="text-align:left">Day</th><th style="text-align:left">Challenge</th><th>Score</th><th>Place</th><th>Pts</th></tr></thead><tbody>
    ${hist.slice().reverse().map(e => `<tr><td style="text-align:left">${fmtDate(e.date)}</td><td style="text-align:left">${esc(e.ch.title)}</td><td>${fmtNum(e.score)} ${esc(e.ch.unit)}</td><td>${ordinal(e.rank)} of ${e.n}</td><td class="pts">${e.pts}</td></tr>`).join("")}</tbody></table></div></details>`;

  return `<section class="panel stack">${head}${kpis}
    <div class="charts2"><div><h3 style="font-size:18px">Bullpen Wars points by ${unitWord}</h3>${barChart(labels, ptsV, "points")}</div>
      <div><h3 style="font-size:18px">Share of the field beaten</h3>${lineChart(labels, [{values:pctV, color:"var(--red)"}], {min:0, max:100, suffix:"%", label:"percent of field beaten"})}
      <p class="legend">100% means he won, 0% means he finished last. It's the fairest way to compare challenges that use different scores.</p></div></div>
    ${repeatHtml ? `<h3 style="font-size:22px;margin-top:4px">Repeat challenges</h3>${repeatHtml}` : `<p class="sub" style="font-size:14px;margin:0">When you run the same challenge again (same name), his scores on it show up here as a trend line.</p>`}
    ${log}</section>`;
}

/* zone + pitch logic */
const ZX = 0.83, ZB = 1.5, ZT = 3.5;
function zoneOf(r) {
  if (r.x == null || r.h == null) return null;
  const ax = Math.abs(r.x);

  if (ax <= 1.1 && r.h >= 1.17 && r.h <= 3.83) return "edge";
  if (ax <= 1.6 && r.h >= 0.6 && r.h <= 4.4) return "chase";
  return "waste";
}
const inZone = r => r.x != null && r.h != null && Math.abs(r.x) <= ZX && r.h >= ZB && r.h <= ZT;
const inEdge = r => r.x != null && r.h != null && Math.abs(r.x) <= ZX + 0.167 && r.h >= ZB - 0.167 && r.h <= ZT + 0.167 && !(Math.abs(r.x) <= ZX - 0.167 && r.h >= ZB + 0.167 && r.h <= ZT - 0.167);

const isSwing = c => c === "StrikeSwinging" || c === "FoulBall" || c === "InPlay";
const isBall = c => c === "BallCalled" || c === "BallinDirt" || c === "BallIntentional" || c === "HitByPitch";
const isStrikeish = c => !isBall(c) && c !== "Undefined";
const HITS = {Single:1, Double:2, Triple:3, HomeRun:4};

/* names in files -> pitchers on this app's roster */
const lettersOnly = s => String(s || "").toLowerCase().replace(/[^a-z]/g, "");
function splitName(n) { n = String(n || "").trim(); const i = n.indexOf(","); if (i > 0) return [n.slice(0, i), n.slice(i + 1)]; const parts = n.split(/\s+/); return [parts.pop() || "", parts.join(" ")]; }
const cleanName = n => String(n || "").replace(/\(.*?\)/g, "").replace(/#\s*\d+/g, "").replace(/\s+/g, " ").trim();
const _mc = new Map();
function matchPitcher(tmName) {
  if (_mc.has(tmName)) return _mc.get(tmName);
  const [l, f] = splitName(tmName).map(lettersOnly), known = allKnownPitchers();
  const same = known.filter(r => lettersOnly(r.last) === l);
  const hit = same.find(r => { const rf = lettersOnly(r.first); return f && rf && (f.startsWith(rf) || rf.startsWith(f) || f[0] === rf[0] && same.length === 1); }) || null;
  _mc.set(tmName, hit); return hit;
}
const numS = v => { if (v == null) return null; const n = parseFloat(String(v).replace(/[^0-9.\-]/g, "")); return Number.isFinite(n) ? n : null; };
function gcSec(pl, re) { if (!pl || !pl.sec) return null; const k = Object.keys(pl.sec).find(x => re.test(x)); return k ? pl.sec[k] : null; }

function pitStats(rows, pas) {
  const st = {pitches: rows.length};
  let str = 0, z = 0, comp = 0, sw = 0, wh = 0, op = 0, os = 0, csw = 0, loc = 0;
  for (const r of rows) {
    if (isStrikeish(r.call)) str++;
    if (r.call === "StrikeCalled" || r.call === "StrikeSwinging") csw++;
    const s = isSwing(r.call); if (s) sw++; if (r.call === "StrikeSwinging") wh++;
    if (r.x != null && r.h != null) { loc++; if (inZone(r)) z++; else { op++; if (s) os++; } if (inComp(r)) comp++; }
  }
  const fb = rows.filter(r => FASTBALLS.has(r.pt) && r.v != null);
  let outs = 0; for (const r of rows) { outs += (r.oop || 0); if (/strikeout/i.test(r.korbb)) outs++; }
  let K = 0, BB = 0, HBP = 0, H = 0, HR = 0, ea = 0, eaN = 0, lo = 0, loN = 0, fps = 0, fpsN = 0, XBH = 0, SAC = 0;
  for (const p of pas) {
    if (p.out === "K") K++; else if (p.out === "BB") BB++; else if (p.out === "HBP") HBP++; else if (HITS[p.out]) { H++; if (p.out === "HomeRun") HR++; if (HITS[p.out] > 1) XBH++; }
    if (/sacrifice/i.test(p.out)) SAC++;
    const first3 = p.pitches.slice(0, 3);
    const strikes = first3.filter(r => isStrikeish(r.call) && r.call !== "InPlay").length;
    const earlyBIP = first3.some(r => r.call === "InPlay");
    eaN++; if (strikes >= 2 || earlyBIP) ea++;
    if (p.pitches[0]) { fpsN++; if (isStrikeish(p.pitches[0].call)) fps++; }
    if (p.lead) { loN++; if (p.out === "K" || p.out === "Out" || /sacrifice/i.test(p.out)) lo++; }
  }

  const fbAll = fbRowsOf(rows), AB = pas.length - BB - HBP - SAC, runsV = rows.map(r => r.runs).filter(v => v != null);
  return Object.assign(st, {BF: pas.length, outs, ip: `${Math.floor(outs / 3)}.${outs % 3}`, K, BB, HBP, H, HR, AB, XBH,
    strike: pct(str, rows.length), zone: pct(z, loc), comp: pct(comp, loc), whiff: pct(wh, sw), chase: pct(os, op), csw: pct(csw, rows.length),

    fbRelH: mean(fbAll.map(r => r.rh)), fbExt: mean(fbAll.map(r => r.ext)), noSide: rows.filter(r => r.bside !== "L" && r.bside !== "R").length});
}
function typeStats(rows) {

  const ord = pt => { const i = PT_ORDER.indexOf(pt); return i < 0 ? 98 : i; };
  return Object.keys(by).sort((a, b) => ord(a) - ord(b)).map(pt => {
    const rs = by[pt], loc = rs.filter(r => r.x != null && r.h != null), sw = rs.filter(r => isSwing(r.call)), vaas = rs.map(r => r.vaa).filter(v => v != null);
    const rh = mean(rs.map(r => r.rh)), side = mean(rs.map(r => r.rs)), va = mean(vaas);

      strike: pct(rs.filter(r => isStrikeish(r.call)).length, rs.length), whiff: sw.length ? pct(rs.filter(r => r.call === "StrikeSwinging").length, sw.length) : null,
      useL: L ? pct(rs.filter(r => r.bside === "L").length, L) : 0, useR: Rn ? pct(rs.filter(r => r.bside === "R").length, Rn) : 0,
      v: mean(rs.map(r => r.v)), vmax: maxOf(rs.map(r => r.v)), spin: mean(rs.map(r => r.spin)), spinMax: maxOf(rs.map(r => r.spin)),
      ivb: mean(rs.map(r => r.ivb)), hb: mean(rs.map(r => r.hb)), ext: mean(rs.map(r => r.ext)),
      rh, rhD: rh != null && ref.rh != null ? (rh - ref.rh) * 12 : null, side, sideD: side != null && ref.rs != null ? (side - ref.rs) * 12 : null,
      vaa: va, vaaS: vaas.length ? Math.min(...vaas) : null, vaaF: vaas.length ? Math.max(...vaas) : null, vaaD: va != null && ref.vaa != null ? va - ref.vaa : null};
  });
}

/* build everything the Data pages read. Runs when data or the roster changes, not on every render */
function rebuildModel() {
  rebuildRoster(); _mc.clear();
  const codes = new Set((S.settings && S.settings.teamCodes) || []);
  const rows = Object.values(S.chunkCache).flatMap(c => c.rows).filter(r => codes.has(r.pteam));
  rows.sort((a, b) => (a.d < b.d ? -1 : a.d > b.d ? 1 : 0) || (a.g < b.g ? -1 : a.g > b.g ? 1 : 0) || ((a.no ?? 0) - (b.no ?? 0)));
  const paMap = new Map();
  for (const r of rows) {
    const k = `${r.g}|${r.inn}|${r.tb}|${r.pa}|${r.bat}`;
    let p = paMap.get(k); if (!p) { p = {g: r.g, d: r.d, pit: r.pit, pitches: [], lead: r.pa === 1}; paMap.set(k, p); }
    p.pitches.push(r); p.pit = r.pit;
  }
  const pas = [];
  for (const p of paMap.values()) {
    p.pitches.sort((a, b) => (a.pp ?? 0) - (b.pp ?? 0));
    const e = p.pitches[p.pitches.length - 1];
    let out = null;
    if (/strikeout/i.test(e.korbb)) out = "K"; else if (/walk/i.test(e.korbb)) out = "BB"; else if (e.call === "HitByPitch") out = "HBP"; else if (e.call === "InPlay") out = e.res || "Out";
    if (!out) continue;
    p.out = out; pas.push(p);
  }
  const games = {};
  for (const g of Object.values(S.games)) {
    const h = codes.has(g.home), a = codes.has(g.away);
    const opp = h && a ? "Intrasquad" : h ? (g.away || "Opponent") : a ? (g.home || "Opponent") : `${g.away || "?"} @ ${g.home || "?"}`;
    games[g.g] = {...g, opp, label: `${fmtMD(g.d)} · ${h && a ? "Intrasquad" : (a ? "@ " : "vs ") + opp}`};
  }
  const pitchers = {};
  for (const h of allKnownPitchers()) pitchers[h.key] = {h, rows: [], pas: [], box: null, gc: null, vids: []};
  for (const r of rows) { const h = matchPitcher(r.pit); if (h) pitchers[h.key].rows.push(r); }
  for (const p of pas) { const h = matchPitcher(p.pit); if (h) pitchers[h.key].pas.push(p); }
  for (const p of Object.values(pitchers)) { p.st = pitStats(p.rows, p.pas); p.games = [...new Set(p.rows.map(r => r.g))].filter(g => games[g]); }
  /* GameChanger: the newest file wins */

    <div class="plotlegend"><span><i style="background:#3FBF74"></i>Front leg holding</span><span><i style="background:#F0566A"></i>Front leg giving</span><span><i style="background:#9CC3FF"></i>Throwing arm</span><span><i style="background:#E0A800"></i>Ball hand</span></div>` : ""}
  </section>`;
  const take = `<div class="cols"><section class="panel"><h3 style="font-size:20px;color:var(--good)">Keep doing</h3>${(fb.strengths || []).length ? fb.strengths.map(s => `<div class="mitem"><span class="ic" style="background:var(--good)" aria-hidden="true">✓</span><div><b>${esc(s.title)}</b><span class="sub">${esc(s.detail)}</span></div></div>`).join("") : `<p class="sub">No clear strengths flagged yet.</p>`}</section>
    <section class="panel"><h3 style="font-size:20px;color:var(--red)">Fix, in order</h3>${(fb.fixes || []).length ? fb.fixes.map((f, i) => `<div class="mitem"><span class="ic" style="background:var(--red)">${i + 1}</span><div><b>${esc(f.title)}</b><span class="sub">${esc(f.detail)}</span></div></div>`).join("") : `<p class="sub">Nothing outside the model ranges.</p>`}</section></div>`;
  const model = `<section class="panel"><div class="row" style="justify-content:space-between;align-items:baseline"><h3 style="font-size:20px">Vs. model</h3><span class="sub" style="font-size:13px">Grey band = model range</span></div>
    ${sc.map(m => { if (m.v == null) return ""; const span = (m.hi - m.lo) * 3, a = m.lo - (m.hi - m.lo), pc = v => Math.max(0, Math.min(100, (v - a) / span * 100));
      return `<div class="mrow"><div class="mtop"><span>${esc(m.label)}</span><b style="color:${GCOL[m.g]}">${fmtV(m, m.v)}</b></div><div class="track"><div class="band" style="left:${pc(m.lo)}%;width:${pc(m.hi) - pc(m.lo)}%"></div><div class="dot" style="left:${pc(m.v)}%;background:${GCOL[m.g]}"></div></div><span class="sub" style="font-size:13px">${GTXT[m.g]}. Model ${fmtRange(m)}</span></div>`; }).join("")}
    <p class="sub fine">Estimates from one camera angle.</p></section>`;
  const items = plan ? plan.focus : (fb.focus || []);
  const sg = coach ? suggestions(h).find(x => /Mo-cap|Mechanics/.test(x.src)) : null, r = routineOf(h.key);
  const focus = `<section class="panel stack"><div><span class="sub" style="font-size:14px">${plan ? `Coach's plan${plan.byName ? " by " + esc(plan.byName) : ""}` : "System suggestion"}</span><h3 style="font-size:22px">Development focus</h3></div>
    ${items.length ? mechFocusHtml(items) : `<p class="sub" style="margin:0">No focus flagged on this capture.</p>`}
    ${plan && plan.notes ? `<p style="margin:0;white-space:pre-line"><b>Coach:</b> ${esc(plan.notes)}</p>` : ""}
    ${sg && sg.flaw !== r.flaw ? `<div class="sugg noprint"><div class="row" style="justify-content:space-between;flex-wrap:nowrap"><span>Make <b>${esc(flawById[sg.flaw].name)}</b> the player focus of his routine?</span><button class="btn navy sm" style="white-space:nowrap" data-act="usefocus" data-f="${sg.flaw}">Use it</button></div></div>` : ""}</section>`;
  const c = cap.csv;
  const clip = `<section class="panel"><h3 style="font-size:20px">This clip</h3>
    ${c && (c.metrics || []).length ? `<div class="kv2">${c.metrics.map(([k, v]) => `<div><span>${esc(k)}</span>${esc(v)}</div>`).join("")}</div>` : ""}
    <p class="sub fine">${throwsTxt(h)}, camera ${esc(cap.camera || "AWRE")}, ${cap.clipSpeed && cap.clipSpeed !== 1 ? "clip slowed " + cap.clipSpeed + "×" : "real speed"}. ${esc(cap.markerSource || "")}</p>
    <div class="row noprint">${labLink}<span class="sub" style="font-size:13px">The original clip, frame photos and marker editing live there.</span></div></section>`;
  return head + take + model + focus + clip;
}

/* ---------- events ---------- */
document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "q") { S.q = t.value; render(); return; }
  if (S.view === "player" && S.canEdit) {
    const key = S.player, r = routineOf(key);
    if (t.id === "cue" || t.id === "notes" || t.id === "mobNotes") { saveRoutine(key, {...r, [t.id]: t.value}, true); return; }
    if (t.id === "feedback") { saveRoutine(key, {...r, feedback: t.value, feedbackFor: r.flaw}, true); return; }
    if (["dose","note","name","how"].includes(t.dataset.f)) {
      const items = r.items.map(i => i.id === t.dataset.i ? {...i, [t.dataset.f]: t.value} : i);
      saveRoutine(key, {...r, items}, true);
    }
  }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "dFlaw") { S.dFlaw = t.value; render(); return; }
  if (t.id === "dArea") { S.dArea = t.value; render(); return; }

  if (t.id === "capSel") { S.capSel[t.dataset.k] = t.value; render(); return; }
  if (t.id === "dataFiles") { const fs = [...t.files]; t.value = ""; handleFiles(fs); return; }
  if (t.dataset.area && S.view === "player" && S.canEdit) {
    const key = S.player, r = routineOf(key), a = t.dataset.area;
    S.editing = true; saveRoutine(key, {...r, mobAreas: t.checked ? [...new Set([...r.mobAreas, a])] : r.mobAreas.filter(x => x !== a)}); render(); return;
  }
  if (t.id === "dPhase") { S.dPhase = t.value; render(); return; }
  if (t.id === "progKey") { S.progKey = t.value; render(); return; }
  if (t.id === "entPlayer") { lsSet(LS_PLAYER, t.value); return; }
  if (t.id === "addDrill") { const box = $("#wiBox"); if (box) { box.hidden = t.value !== "__write"; if (!box.hidden) $("#wiName").focus(); } return; }
  if (t.id === "chPreset" && t.value !== "") { const p = PRESETS[+t.value]; $("#chTitle").value = p.title; $("#chRules").value = p.rules; $("#chUnit").value = p.unit; $("#chBetter").value = p.better; return; }
  if (S.view === "player" && S.canEdit) {
    const key = S.player, r = routineOf(key);
    if (t.id === "flaw") {
      S.editing = true;
      const next = {...r, flaw:t.value, feedback:null, feedbackFor:null};
      if (t.value && !r.items.some(i => i.phase !== "Mobility")) next.items = [...r.items, ...buildFromFlaw(t.value)];
      saveRoutine(key, next); render();
      if (t.value && !r.items.some(i => i.phase !== "Mobility")) toast("Routine built from his player focus. Adjust anything you like.");
      return;
    }

    if (t.dataset.f === "drill" || t.dataset.f === "phase") {
      const items = r.items.map(i => { if (i.id !== t.dataset.i) return i; if (t.dataset.f === "drill") { if (t.value === "__write") { const old = drillById(i.drill); return {...i, drill:"", name: old ? old.name : "", how: old ? old.how : ""}; } const d = drillById(t.value); return {...i, drill:t.value, name:null, how:null, dose:d ? d.dose : i.dose}; } return {...i, phase:t.value}; });
      saveRoutine(key, {...r, items}); render();
    }
  }
});
document.addEventListener("click", async e => {

    }

      saveRoutine(key, {...r, items:[...r.items, {id:uid(), drill:id, phase, dose:d.dose, note:""}]}); render(); toast(phase === "Mobility" && S.ptab !== "mobility" ? `${d.name} added to his Mobility tab` : phase !== "Mobility" && S.ptab === "mobility" ? `${d.name} added to his Routine tab` : `${d.name} added`); return;
    }
    if (act === "editplan") { S.editing = !S.editing; render(); if (!S.editing) toast("Plan saved. This is what he sees."); return; }
    const i = r.items.findIndex(x => x.id === b.dataset.i);
    if (i < 0) return;
    if (act === "edititem") {

    if (act === "rm") {
      const gone = r.items[i], gd = gone.drill ? drillById(gone.drill) : null, nm = gd ? gd.name : (gone.name || "this drill");
      items.splice(i, 1); saveRoutine(key, {...r, items}); render();
      toast(`${nm} removed from ${byNo[key].first}'s plan`, () => {

      });

  }

    if (!(await askConfirm(`Are you #${h.no} ${h.short}? This links your account to your name for Bullpen Wars. Only a coach can change it.`, "Yes, that's me"))) return;

  if (act === "strange") { S.stRange = b.dataset.v; render(); return; }
  if (act === "tf") { S.tf = b.dataset.v; render(); return; }

  }
