  }
  if (act === "toggle") { const c = {...S.challenges[S.cid]}; c.status = c.status === "closed" ? "open" : "closed"; S.challenges[c.id] = c; write(`${P_CH}/${c.id}`, c); render(); toast(c.status === "closed" ? "Scoring closed" : "Scoring reopened"); return; }
  if (act === "delch") {
    const c = S.challenges[S.cid]; if (!(await askConfirm(`Delete "${c.title}" and its scores?`, "Delete"))) return;
    Object.values(S.scores).filter(s => s.cid === c.id).forEach(s => { delete S.scores[s.id]; write(`${P_SC}/${s.id}`, null, true); });
    delete S.challenges[c.id]; write(`${P_CH}/${c.id}`, null, true); S.cid = null; render(); toast("Challenge deleted"); return;
  }
  if (act === "newdrill") { drillDialog(); return; }
  if (act === "editdrill") { drillDialog(drillById(b.dataset.id)); return; }
  if (act === "deldrill") { const d = S.customDrills[b.dataset.id]; if (!(await askConfirm(`Delete "${d.name}" from the library? Routines using it will show it as removed.`, "Delete"))) return; delete S.customDrills[d.id]; write(`${P_DRILL}/${d.id}`, null, true); render(); return; }
});
const ordinal = n => { const v = n % 100; return n + (v >= 11 && v <= 13 ? "th" : ({1:"st",2:"nd",3:"rd"}[n % 10] || "th")); };

/* ---------- data ---------- */
function subscribe(path, target, after){
  let first = true;
  const timer = setTimeout(() => { if (first) { S.stale = true; S.ready[target] = true; render(); } }, 10000);
  S.db.collection(path).onSnapshot(snap => {
    const next = {};
    snap.docs.forEach(d => { next[d.id] = {...d.data(), id: d.data().id || d.id}; });
    S[target] = next; S.ready[target] = true;
    if (!snap.metadata || !snap.metadata.fromCache) { clearTimeout(timer); if (first) { first = false; } S.stale = false; }
    if (after) after();
    /* don't wipe what a coach is typing */
    const a = document.activeElement;
    if (a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA") && a.type !== "checkbox" && a.type !== "file" && target !== "scores") return;
    render();
  }, err => { clearTimeout(timer); console.error(err); S.ready[target] = true; S.stale = true; render(); });
}

/* ---------- start-up: Supabase login (see the core script above) ---------- */
function keyOfNo(k){ const h = allKnownPitchers().find(x => x.key === String(k)); return h ? CORE.ownerKeyOf(h.first, h.last) : null; }
window.LAB = {
  app: "pitching", name: "Pitching Lab", state: () => S, myEntry,
  /* private documents get stamped with the player they belong to, so the database only shows them to him (and coaches) */
  prime(docs) { for (const d of docs) if (d.coll === P_RO) S.roster[d.doc_id] = {...d.data, id: d.doc_id}; rebuildRoster(); },
  ownerOf(coll, id, d) { if (coll === P_ROUT) return keyOfNo(id); if (coll === P_SC) return keyOfNo(d.no); if (coll === "pdata") return d._owner || null; return null; },
  start(db, user, assets) {
    S.db = db; S.user = user; S.assets = assets; S.dbReady = true; S.userId = CORE.user.id;
    S.canEdit = S.realOwner = CORE.coach; S.ready.claims = S.ready.keepers = true;
    const role = $("#role"); role.hidden = false; role.textContent = S.canEdit ? "Coach view" : "Player view";
    subscribe(P_ROUT, "routines"); subscribe(P_DRILL, "customDrills"); subscribe(P_CH, "challenges"); subscribe(P_SC, "scores"); subscribe(P_RO, "roster", rebuildModel);
    if (CORE.coach) {
      db.doc("config/settings").onSnapshot(snap => { if (snap.exists) { S.settings = {teamCodes: [], ...snap.data()}; dataChanged(); } }, e => console.error(e));
      const gt = setTimeout(() => { if (!S.ready.games) { S.ready.games = true; S.stale = true; render(); } }, 10000);
      db.collection("games").onSnapshot(snap => { clearTimeout(gt); onGames(snap); }, err => { clearTimeout(gt); console.error(err); S.ready.games = true; render(); });
      subscribe("gc", "gc", rebuildModel); subscribe("videos", "videos", rebuildModel); subscribe("captures", "caps", schedulePublish);
      db.collection("pdata").onSnapshot(snap => { S.pubDocs = Object.fromEntries(snap.docs.map(d => [d.id, d.data()])); schedulePublish(); }, e => console.error(e));
      db.doc("board/team").onSnapshot(snap => { S.pubBoard = snap.exists ? snap.data() : {}; schedulePublish(); }, e => console.error(e));
    } else {
      S.pub = {pct: {}, board: null, team: null};
      db.collection("pdata").onSnapshot(onPdata, e => { console.error(e); S.ready.games = S.ready.caps = true; render(); });
      db.doc("board/team").onSnapshot(snap => { S.pub.board = snap.exists ? snap.data() : null; render(); }, e => console.error(e));
    }
    route();
  }
};
/* a player only ever receives his own published data */
function onPdata(snap){
  const docs = snap.docs.map(d => d.data()).filter(Boolean);
  S.games = {}; S.chunkCache = {}; S.videos = {}; S.caps = {}; S.pub.pct = {}; S.pub.team = null;
  const codes = new Set(), gcPlayers = []; let gcMeta = null;
  for (const d of docs) {
    Object.assign(S.games, d.games || {});
    for (const c of d.chunks || []) { const cc = S.chunkCache[c.g] || (S.chunkCache[c.g] = {stamp: 0, rows: []}); cc.rows.push(...rowsFromChunk(c)); }
    (d.teamCodes || []).forEach(x => codes.add(x));
    if (d.gc) { gcPlayers.push(d.gc.pl); gcMeta = gcMeta || d.gc; }
    Object.assign(S.videos, d.vids || {});
    for (const [id, c] of Object.entries(d.caps || {})) S.caps[id] = {...c, id};
    if (d.key) S.pub.pct[d.key] = d.pct || {};
    if (d.team) S.pub.team = d.team;
  }
  S.gc = gcMeta ? {pub: {label: gcMeta.label, uploadedAt: gcMeta.uploadedAt, players: gcPlayers}} : {};
  S.settings = {teamCodes: [...codes]};
  S.ready.games = S.ready.caps = true; dataChanged();
}
function pubBoardHtml(){
  const b = S.pub.board, me = playerKey();
  if (!b || !b.html) return `<div class="stack"><div><h1 style="font-size:34px">Leaderboards</h1></div><p class="empty">Leaderboards show up once the coaches add Trackman or GameChanger files.</p></div>`;
  return me ? b.html.split(`<li data-k="${me}">`).join(`<li data-k="${me}" class="me">`) : b.html;
}
/* coaches' app: after the numbers change, publish each pitcher's own data and the team board */
const hashStr = s => { let h = 5381; for (let i = 0; i < s.length; i++) h = (h * 33 + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36) + s.length.toString(36); };
let pubTimer = null, publishing = false;
function schedulePublish(){ if (!window.CORE || !CORE.coach) return; clearTimeout(pubTimer); pubTimer = setTimeout(publish, 2500); }
async function publish(){
  if (!CORE.coach || S.preview || publishing) return;
  if (!S.ready.games || !S.model || !S.pubDocs || !S.pubBoard || !S.ready.roster || !S.ready.caps || !S.ready.videos) { schedulePublish(); return; }
  publishing = true;
  try {
    /* routines saved before a player's login existed get his name stamped on now */
    for (const [k, r] of Object.entries(S.routines)) { const o = keyOfNo(k); if (o && r._owner !== o) await S.db.doc(P_ROUT + "/" + k).set(r).catch(e => console.error(e)); }
    const latest = Object.values(S.gc).filter(Boolean).sort((a, b) => (b.uploadedAt || 0) - (a.uploadedAt || 0))[0];
    const pl = pool(), team = S.model.team;
    for (const h of PITCHERS) {
      const owner = CORE.ownerKeyOf(h.first, h.last), p = modelOf(h); if (!owner || !p) continue;
      const byG = {};
      for (const r of p.rows) (byG[r.g] || (byG[r.g] = {g: r.g, d: r.d, home: r.home, away: r.away, cols: PACK, rows: []})).rows.push(packRow(r));
      const pct = {};
      if (p.rows.length) for (const [, items] of PIT_PCT) for (const [k, , , low] of items) { const q = percentileRaw(pl, k, p.st[k], low); if (q != null) pct[k] = q; }
      const vids = Object.fromEntries(p.vids.map(v => { const {id, ...rest} = v; return [id, rest]; }));
      const caps = Object.fromEntries(capsFor(h).map(c => { const {id, ...rest} = c; return [id, rest]; }));
      const doc = {_owner: owner, key: h.key, chunks: Object.values(byG), games: Object.fromEntries(Object.keys(byG).filter(g => S.games[g]).map(g => [g, S.games[g]])),
        teamCodes: S.settings.teamCodes || [], gc: p.gcRaw ? {label: latest ? latest.label : "", uploadedAt: latest ? latest.uploadedAt : 0, pl: p.gcRaw} : null, pct, team, vids, caps};
      const old = S.pubDocs[h.key];
      if (!old && !doc.chunks.length && !doc.gc && !Object.keys(caps).length && !Object.keys(vids).length) continue;
      doc.h = hashStr(JSON.stringify(doc));
      if (old && old.h === doc.h) continue;
      await S.db.doc("pdata/" + h.key).set(doc).catch(e => console.error(e));
    }
    S.publishing = true; let html = "";
    try { html = viewLeaders(); } finally { S.publishing = false; }
    const games = Object.keys(S.games).length;
    if (S.pubBoard.html !== html || S.pubBoard.games !== games) await S.db.doc("board/team").set({html, games, at: Date.now()}).catch(e => console.error(e));
  } finally { publishing = false; }
}
CORE.boot();
</script>
